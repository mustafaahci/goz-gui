[package]
name = "goz-gui"
description = "Native Windows GUI for goz, the instant NTFS file search engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Mustafa Ahci"]
publish = false

[[bin]]
name = "goz-gui"
path = "src/main.rs"

[dependencies]
# The wire protocol and the pipe trust check come straight from goz, so the GUI
# speaks exactly what gozd speaks and never re-implements the framing.
goz-core = { git = "https://github.com/mustafaahci/goz", tag = "v0.6.0" }
goz-winfs = { git = "https://github.com/mustafaahci/goz", tag = "v0.6.0" }
# The windows crate's own core (already built for it): `#[implement]`, for
# the COM objects goz-gui makes itself (the preview handlers' frame and
# stream, F1; the file operations' progress sink, F5), names it in the code
# it generates.
windows-core = "0.62.2"

# Advanced Rename (wave 1, F5): its regular expressions.
regex = { version = "1.12", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    # Icon locations written with %SystemRoot% and the like.
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    # Options > Fonts and Colors: the colour picker (ChooseColorW).
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# COM interfaces for the shell (context menus, data objects, file
# operations); everything else stays on windows-sys.
[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    # STGMEDIUM, which reading a data object's contents (GetData) takes.
    "Win32_Graphics_Gdi",
    # The preview pane: WIC decodes images, preview handlers are
    # initialized through the property system's IInitializeWith*, and
    # WIC's metadata (an image's orientation) comes as a PROPVARIANT.
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    # Wave 4 (G2): accessibility for what goz-gui paints itself (`a11y.rs`).
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Quick optimized builds for testing: thin LTO and parallel codegen build in
# a fraction of the release profile's time. `cargo build --profile fast`.
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
