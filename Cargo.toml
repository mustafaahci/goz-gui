[package]
name = "goz-gui"
description = "Native Windows GUI for goz, the instant NTFS file search engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Mustafa Ahci"]
publish = false

[[bin]]
name = "goz-gui"
path = "src/main.rs"

[dependencies]
# The wire protocol and the pipe trust check come straight from goz, so the GUI
# speaks exactly what gozd speaks and never re-implements the framing.
goz-core = { git = "https://github.com/mustafaahci/goz", tag = "v0.6.0" }
goz-winfs = { git = "https://github.com/mustafaahci/goz", tag = "v0.6.0" }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# COM interfaces for the shell (context menus, data objects, file
# operations); everything else stays on windows-sys.
[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    # STGMEDIUM, which reading a data object's contents (GetData) takes.
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
